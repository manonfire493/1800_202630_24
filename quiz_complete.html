<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->

    <br><br><br>
    <div class="card text-center">
        <div class="card-header" id="completed-header">
            Quiz Complete! Grade: 
        </div>
        <div class="card-body">
            <h5 class="card-title result" id="score-percentage" styke="font-size:xx-large;">You done did it </h5>
            <p class="card-text" id="completed-score">
                You scored
                <span class="result" id="quiz-score">loading...</span> 
                out of 
                <span class="result" id="quiz-max">...</span>

            </p>
            <a href="index.html" class="btn btn-primary">Return to Home</a>
        </div>
        <div class="card-footer text-body-secondary">
            You may retry the quiz at any time
        </div>
    </div>
    <br><br><br>

    <div class="container-fluid bg-body text-dark p-5">
      <h1>Answers:</h1>
      <div id="answers-go-here" class="row"></div>
    </div>

    <template id="questionCompleteTemplate">
        <div class="question-container">
            <p><b>Question #<span class="question-number"></span></b></p>
            <p class="question-text"></p>

            <p id="user-answer" class="answer">Your answer: </p>
            <p id="question-answer" class="answer">The answer: </p>
            <p id="user-result" class="answer result">Result: </p>
        </div>
    </template>


    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/completeQuiz.js"></script>

</body>

</html>
